[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudserve-support-orchestrator"
version = "0.1.0"
description = "CloudServe Support Orchestrator System"
authors = [{ name = "Amlan Acharya" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.10.0,<2.0.0",
    "langgraph>=0.0.26",
    "chromadb==0.3.21",
    "sentence-transformers>=2.2.2",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

